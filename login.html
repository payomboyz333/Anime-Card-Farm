<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ | PayomboyZ HUB Store</title>
  <meta name="description" content="เข้าสู่ระบบ PayomboyZ HUB เพื่อสั่งซื้อคีย์สคริปต์ Roblox VIP/VVIP เติมเงิน และจัดการบัญชีของคุณ" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 2;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin: 0 auto 12px auto;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      overflow: hidden;
    }

    .auth-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .auth-switch-prompt {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-2);
    }

    .auth-switch-prompt a {
      color: var(--accent-light);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }

    .auth-switch-prompt a:hover {
      text-decoration: underline;
      color: #fff;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      margin-bottom: 16px;
      transition: var(--transition);
    }

    .back-home-link:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="auth-page-container">
    <div class="auth-card glass">
      <a href="index.html" class="back-home-link">← กลับไปยังหน้าหลัก (Store Index)</a>
      
      <div class="auth-header">
        <div class="auth-brand-logo">
          <img src="543199739_2812856088914181_3062917809445648175_n.jpg" alt="Logo" />
        </div>
        <h1 class="auth-title">เข้าสู่ระบบสมาชิก</h1>
        <p class="auth-subtitle">PayomboyZ HUB — สคริปต์ Roblox คุณภาพสูง</p>
      </div>

      <button class="discord-login-btn" onclick="loginWithDiscord()" style="width:100%;margin-bottom:16px;">
        <svg style="width:20px;height:20px;fill:currentColor;" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        เข้าสู่ระบบด้วย Discord OAuth
      </button>

      <div style="display:flex;align-items:center;margin:16px 0;gap:10px;">
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
        <span style="font-size:11px;color:rgba(255,255,255,0.4);">หรือเข้าสู่ระบบด้วยชื่อผู้ใช้</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
      </div>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label>ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="loginUsername" class="form-input" placeholder="ระบุชื่อผู้ใช้..." required />
        </div>
        <div class="form-group">
          <label>รหัสผ่าน (Password)</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn accent" style="width:100%;padding:12px;font-weight:700;font-size:15px;margin-top:8px;">
          🚀 เข้าสู่ระบบทันที
        </button>
      </form>

      <div class="auth-switch-prompt">
        ยังไม่มีบัญชีสมาชิก? <a href="register.html">สมัครสมาชิกใหม่ที่นี่</a>
      </div>
    </div>
  </div>

  <script>
    function loginWithDiscord() {
      const mockDiscordUser = {
        username: 'PayomboyZ_Gamer',
        discordId: '827364591028374',
        balance: 150,
        keys: []
      };
      localStorage.setItem('payomboy_user', JSON.stringify(mockDiscordUser));
      alert('✅ เข้าสู่ระบบด้วย Discord สำเร็จ!');
      window.location.href = 'index.html';
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const user = {
        username: username,
        balance: 0,
        keys: []
      };
      localStorage.setItem('payomboy_user', JSON.stringify(user));
      alert('✅ เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ ' + username);
      window.location.href = 'index.html';
    }
  </script>
</body>

</html>
